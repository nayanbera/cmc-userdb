<tr id="jr-{{ j.key | replace(' ', '-') }}">
  <td>{{ j.name }}{% if j.matched and j.matched != j.name %} <span class="text-muted small">(OpenAlex: {{ j.matched }})</span>{% endif %}</td>
  <td class="text-end">{{ j.papers }}</td>
  <td class="text-end text-muted" title="{% if j.fetched %}fetched {{ j.fetched }}{% endif %}">{{ '%.2f' % j.openalex if j.openalex is not none else '—' }}</td>
  <td style="width:150px">
    <input type="number" step="0.001" min="0" name="official" value="{{ j.official if j.official is not none else '' }}"
           class="form-control form-control-sm" placeholder="official" aria-label="Official impact factor of {{ j.name }}"
           hx-post="/journals/{{ j.key | urlencode }}" hx-include="closest tr" hx-trigger="change" hx-target="closest tr" hx-swap="outerHTML">
  </td>
  <td style="width:110px">
    <input type="text" name="year" value="{{ j.official_year }}" class="form-control form-control-sm" placeholder="JCR year" maxlength="9"
           aria-label="Year of the official impact factor of {{ j.name }}"
           hx-post="/journals/{{ j.key | urlencode }}" hx-include="closest tr" hx-trigger="change" hx-target="closest tr" hx-swap="outerHTML">
  </td>
  <td class="small text-nowrap">
    {% if j.official is not none %}<span class="badge bg-primary">official</span>
    {% elif j.openalex is not none %}<span class="badge bg-secondary">OpenAlex</span>
    {% else %}<span class="text-muted">none</span>{% endif %}
  </td>
</tr>
